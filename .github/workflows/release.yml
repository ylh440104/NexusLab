name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all package tests
        run: pnpm test

      - name: Type check all packages
        run: pnpm typecheck

      - name: Verify generated action catalog is up to date
        run: node tools/check-action-catalog.mjs

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            target: win32-x64
          - name: linux-x64
            os: ubuntu-latest
            target: linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native smoke tests
        run: pnpm test:native

      # Always builds the WebUI flavor — no separate "core-only" artifact.
      - name: Build project
        env:
          NEXUSLAB_TARGET: ${{ matrix.target }}
        run: pnpm run build:all

      - name: Verify release layout
        run: pnpm check:release-layout

      # Naming convention:
      #   NexusLab-<tag>-<arch>.zip|tar.gz        – zero-install (node bundled)
      #   NexusLab-<tag>-<arch>-lite.zip|tar.gz   – user provides Node ^24.22.1 or >=26.12.1
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "NexusLab-${{ github.ref_name }}-${{ matrix.name }}-lite.zip"
          Copy-Item (Get-Command node).Source -Destination "dist\node.exe"
          Compress-Archive -Path "dist\*" -DestinationPath "NexusLab-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Package (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          chmod +x dist/launcher.sh
          tar -czf "NexusLab-${{ github.ref_name }}-${{ matrix.name }}-lite.tar.gz" -C dist .
          cp "$(command -v node)" dist/node
          chmod +x dist/node
          tar -czf "NexusLab-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C dist .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: NexusLab-${{ github.ref_name }}-${{ matrix.name }}*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for git log)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -lh release/

      - name: Generate release note
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          previousTag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [[ -n "$previousTag" ]]; then
            range="$previousTag..$tag"
            comparison="[查看 ${previousTag} → ${tag} 的完整差异](https://github.com/${GITHUB_REPOSITORY}/compare/${previousTag}...${tag})"
          else
            range="$tag"
            comparison=""
          fi
          changes="$(git log --no-merges --invert-grep --grep='^chore(release):' --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "$range")"
          [[ -z "$changes" ]] && changes="- No commit changes detected."
          cat > release-notes.md <<EOF
          # NexusLab ${tag}

          > **跨平台正式支持：** Windows x64、Linux x64 与 Linux arm64 均可完整运行 NexusLab，包含 QQ 接入、OneBot v11 与 WebUI 管理能力。

          ## 选择下载

          | 平台 | 完整版（内置 Node.js，推荐） | Lite（Node.js 24.22.1 / 26.12.1 起） |
          | --- | --- | --- |
          | Windows x64 | \`NexusLab-${tag}-win-x64.zip\` | \`NexusLab-${tag}-win-x64-lite.zip\` |
          | Linux x64 | \`NexusLab-${tag}-linux-x64.tar.gz\` | \`NexusLab-${tag}-linux-x64-lite.tar.gz\` |
          | Linux arm64 | \`NexusLab-${tag}-linux-arm64.tar.gz\` | \`NexusLab-${tag}-linux-arm64-lite.tar.gz\` |

          完整版适合直接解压运行；Lite 版不包含 Node.js，但其余运行时依赖和 WebUI 静态资源保持一致。

          ## 快速开始

          1. 解压与你的系统架构匹配的压缩包。
          2. Windows 运行 \`launcher.bat\`；Linux 运行 \`./launcher.sh\`。
          3. 浏览器访问 http://localhost:5099 ，初始账号为 \`admin\`，密码见启动日志。

          无人值守部署可同时设置 \`NEXUSLAB_ACCEPT_EULA=1\` 与 \`NEXUSLAB_ACCEPT_PRIVACY=1\` 完成协议确认。设置这些变量即表示运营者已阅读并同意发行包内的 EULA 与隐私政策；缺少任意一项时仍会显示同意页面。

          ## 本次更新

          ${changes}

          ${comparison}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          body_path: release-notes.md
          overwrite_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download linux-x64 lite tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -fsSL --retry 5 --retry-delay 5 -o app.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/NexusLab-${TAG}-linux-x64-lite.tar.gz"
          mkdir -p docker-context
          tar -xzf app.tar.gz -C docker-context

      - name: Write Dockerfile
        run: |
          cat > docker-context/Dockerfile <<'DOCKERFILE'
          FROM node:24.22.1-slim
          WORKDIR /app
          COPY . .
          ENV NEXUSLAB_ACCEPT_EULA=1 \
              NEXUSLAB_ACCEPT_PRIVACY=1 \
              NEXUSLAB_WEBUI_HOST=0.0.0.0
          EXPOSE 5099
          CMD ["node", "index.mjs"]
          DOCKERFILE

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexuslab:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nexuslab:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
