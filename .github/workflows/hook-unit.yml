name: Hook Unit Test (mock napi)

on:
  workflow_dispatch:
  push:
    paths:
      - 'hook-test/**'
      - 'linux-hook-so/**'
      - '.github/workflows/hook-unit.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs-dev libnode-dev 2>/dev/null || true
          echo "NODE_INC=$(node -p "require('path').dirname(process.execPath)")/../include/node"
          ls /usr/include/node 2>/dev/null | head -3 || echo 'no system headers'

      - name: Build mock addon (direct gcc)
        run: |
          mkdir -p /tmp/addon
          cd /tmp/addon
          cp "$GITHUB_WORKSPACE/hook-test/mock_addon.c" .
          NODE_INC=""
          for d in /usr/include/node /usr/local/include/node \
                   "$HOME/node/include/node"; do
            if [ -f "$d/node_api.h" ]; then NODE_INC="$d"; break; fi
          done
          if [ -z "$NODE_INC" ]; then
            echo 'fetching headers from nodejs.org'
            curl -sSL -o /tmp/node.tar.xz \
              "https://nodejs.org/dist/v20.18.0/node-v20.18.0-headers.tar.xz"
            tar -xJf /tmp/node.tar.xz -C /tmp
            NODE_INC=/tmp/node-v20.18.0/include/node
          fi
          echo "using headers: $NODE_INC"
          ls "$NODE_INC/node_api.h"
          gcc -shared -fPIC -O2 -I"$NODE_INC" \
            -o mock_addon.node mock_addon.c
          ls -la mock_addon.node

      - name: Baseline (no hook)
        run: |
          cp /tmp/addon/mock_addon.node "$GITHUB_WORKSPACE/hook-test/"
          cd "$GITHUB_WORKSPACE/hook-test"
          echo '=== baseline without hook ==='
          node test.cjs

      - name: Build hook library
        run: |
          cd "$GITHUB_WORKSPACE/linux-hook-so"
          g++ -shared -fPIC -O2 -std=c++17 -pthread \
            -o /tmp/nexuslab-hook.so \
            hook.cc napi_hook.cc inline_hook.cc
          ls -la /tmp/nexuslab-hook.so

      - name: Hooked run (LD_PRELOAD)
        run: |
          cd "$GITHUB_WORKSPACE/hook-test"
          rm -f /tmp/nexuslab-napi-hook.log
          echo '=== hooked run (delay 0, wait window 400ms) ==='
          NEXUSLAB_HOOK_DELAY_MS=0           HOOK_WAIT_MS=400           LD_PRELOAD=/tmp/nexuslab-hook.so node test.cjs; RC=$?
          echo "exit code: $RC"
          echo
          echo '=== hook log ==='
          cat /tmp/nexuslab-napi-hook.log 2>/dev/null || echo '(no log)'
          echo
          echo '=== checks ==='
          grep -q 'proxy' /tmp/nexuslab-napi-hook.log 2>/dev/null \
            && echo 'PROXY_TRIGGERED' || echo 'PROXY_NOT_TRIGGERED'
          grep -q 'captured' /tmp/nexuslab-napi-hook.log 2>/dev/null \
            && echo 'CAPTURE_OK' || echo 'CAPTURE_NONE'
          exit $RC
