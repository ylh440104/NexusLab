name: Hook Unit Test (mock napi)

on:
  workflow_dispatch:
  push:
    paths:
      - 'hook-test/**'
      - 'linux-hook-so/**'
      - '.github/workflows/hook-unit.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs-dev libnode-dev 2>/dev/null || true
          ls /usr/include/node 2>/dev/null | head -3 || echo 'no system headers'

      - name: Build mock addon (direct gcc)
        run: |
          mkdir -p /tmp/addon
          cd /tmp/addon
          cp "$GITHUB_WORKSPACE/hook-test/mock_addon.c" .
          NODE_INC=""
          for d in /usr/include/node /usr/local/include/node \
                   "$HOME/node/include/node"; do
            if [ -f "$d/node_api.h" ]; then NODE_INC="$d"; break; fi
          done
          if [ -z "$NODE_INC" ]; then
            curl -sSL -o /tmp/node.tar.xz \
              "https://nodejs.org/dist/v20.18.0/node-v20.18.0-headers.tar.xz"
            tar -xJf /tmp/node.tar.xz -C /tmp
            NODE_INC=/tmp/node-v20.18.0/include/node
          fi
          echo "using headers: $NODE_INC"
          gcc -shared -fPIC -O2 -I"$NODE_INC" -o mock_addon.node mock_addon.c
          ls -la mock_addon.node

      - name: Build hook library
        run: |
          cd "$GITHUB_WORKSPACE/linux-hook-so"
          g++ -shared -fPIC -O2 -std=c++17 -pthread \
            -o /tmp/nexuslab-hook.so \
            hook.cc napi_hook.cc inline_hook.cc
          ls -la /tmp/nexuslab-hook.so
          nm -D /tmp/nexuslab-hook.so | grep nexuslab_linux_hook_send_reply || true

      - name: Baseline (no hook)
        run: |
          cp /tmp/addon/mock_addon.node "$GITHUB_WORKSPACE/hook-test/"
          cd "$GITHUB_WORKSPACE/hook-test"
          echo '=== baseline without hook ==='
          node test.cjs

      - name: Test 1 - interception and passthrough
        run: |
          cd "$GITHUB_WORKSPACE/hook-test"
          rm -f /tmp/nexuslab-napi-hook.log
          echo '=== test 1 ==='
          OUT=$(NEXUSLAB_HOOK_DELAY_MS=0 HOOK_WAIT_MS=400 \
                timeout 30 env LD_PRELOAD=/tmp/nexuslab-hook.so node test.cjs 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q 'ALL_PASS' || { echo 'TEST1_FAILED'; exit 1; }
          echo 'TEST1_OK'
          grep -E 'captured|proxy' /tmp/nexuslab-napi-hook.log | tail -6

      - name: Test 2 - protocol frames
        run: |
          cd "$GITHUB_WORKSPACE/hook-test"
          rm -rf /tmp/nlrt && mkdir -p /tmp/nlrt
          rm -f /tmp/proto_trace.log
          echo '=== test 2 ==='
          OUT=$(NEXUSLAB_RUNTIME_DIR=/tmp/nlrt NEXUSLAB_HOOK_RUNTIME_DIR=/tmp/nlrt \
                NEXUSLAB_HOOK_DELAY_MS=0 \
                timeout 30 env LD_PRELOAD=/tmp/nexuslab-hook.so node protocol_test.cjs 2>&1 || true)
          echo "$OUT"
          echo '--- proto trace ---'
          cat /tmp/proto_trace.log 2>/dev/null || true
          echo "$OUT" | grep -q 'PROTOCOL_ALL_PASS' || { echo 'TEST2_FAILED'; exit 1; }
          echo 'TEST2_OK'

      - name: Test 3 - end to end bridge roundtrip
        run: |
          cd "$GITHUB_WORKSPACE/hook-test"
          rm -rf /tmp/nlrt2 && mkdir -p /tmp/nlrt2
          echo '=== test 3 ==='
          OUT=$(NEXUSLAB_RUNTIME_DIR=/tmp/nlrt2 NEXUSLAB_HOOK_RUNTIME_DIR=/tmp/nlrt2 \
                NEXUSLAB_HOOK_DELAY_MS=0 \
                timeout 30 env LD_PRELOAD=/tmp/nexuslab-hook.so node e2e_bridge.cjs 2>&1 || true)
          echo "$OUT"
          echo '--- bridge log ---'
          grep -E 'bridge|sender' /tmp/nexuslab-napi-hook.log 2>/dev/null | tail -12 || true
          echo "$OUT" | grep -q 'E2E_ALL_PASS' || { echo 'TEST3_FAILED'; exit 1; }
          echo 'TEST3_OK'
